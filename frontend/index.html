<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<style>
  table button {
    width: 80px;
  }
</style>

<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->
  <header>
    <nav class="navbar navbar-expand-sm navbar-light bg-dark text-light">
      <div class="container">
        <a class="navbar-brand text-light fw-bold fs-4" href="#">Expense Tracker</a>
      </div>
      </div>
    </nav>
  </header>

  <body class="bg-light">
    <div class="container">

      <!--Stats Cards-->
      <div class="row justify-content-center align-items-center my-4 g-3">

        <div class="col-md-4">
          <div class="d-flex card justify-content-center align-items-center">
            <div class="card-body">
              <p class="card-text text-center text-muted fw-medium">Total</p>
              <h4 class="card-title text-center">0.0</h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex card justify-content-center align-items-center">
            <div class="card-body">
              <p class="card-text text-center text-muted fw-medium">Number of expenses</p>
              <h4 class="card-title text-center">0</h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex card justify-content-center align-items-center">
            <div class="card-body">
              <p class="card-text text-center text-muted fw-medium">Highest expense</p>
              <h4 class="card-title text-center">0.0</h4>
            </div>
          </div>
        </div>

      </div>

      <!--Add expense Card-->
      <div class="row justify-content-center align-items-center my-4 g-3">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <p class="card-text fw-bold fs-5 text-muted fw-medium" id="testpara">Add Expense</p>
              <form class="" action="">

                <div class="row">
                  <div class="mb-3 col-md-4">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="Lunch">
                  </div>

                  <div class="mb-3 col-md-2">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" class="form-control" id="amount" name="amount" placeholder="4.50">
                  </div>

                  <div class="mb-3 col-md-3">
                    <label for="category" class="form-label">Category</label>
                    <select class="form-select" name="category" id="category">
                      <option value="none" selected disabled>Choose...</option>
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div class="mb-3 col-md-3">
                    <label for="Date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" />
                  </div>
                </div>
                <button class="btn btn-primary col-12 col-md-auto" type="submit">
                  Add expense
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!--Table Card-->
      <div class="row justify-content-center align-items-center my-4 g-3">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
                <p class="card-text fw-bold fs-5 text-muted">Expenses</p>
                <!--Sort & Filter Form-->
                <form class="row g-2" action="">
                  <!--Sort-->
                  <div class="d-flex col-md-5 col-11 align-items-center justify-content-center">
                    <label for="sort-by" class="form-label mx-2">Sort:</label>
                    <select class="form-select" name="sort_by" id="sort-by">
                      <option value="Default" selected>Default</option>
                      <option value="Title">Title</option>
                      <option value="Amount">Amount</option>
                      <option value="Category">Category</option>
                      <option value="Date">Date</option>
                    </select>
                  </div>
                  <!--Filter-->
                  <div class="d-flex col-md-7 col-11 align-items-center justify-content-center">
                    <label for="category-filter" class="form-label mx-2">Category:</label>
                    <select class="form-select" name="category_filter" id="category-filter">
                      <option value="All" selected>All</option>
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                </form>
              </div>
              <!--Alert Placeholder-->
              <div id="liveAlertPlaceholder"></div>
              <!--Expenses table-->
              <div class="table-responsive">
                <table class="table table-striped table-hover overflow-auto">
                  <!--Expenses table header-->
                  <thead>
                    <tr>
                      <th scope="col" class="col-4">Title</th>
                      <th scope="col" class="col-1">Amount</th>
                      <th scope="col" class="col-1">Category</th>
                      <th scope="col" class="col-3">Date</th>
                      <th scope="col" class="col-3 text-center">Action</th>
                    </tr>
                  </thead>
                  <!--Expenses table body-->
                  <tbody id="expenses-table-body">
                    <tr>
                      <td>Electricity</td>
                      <td>20</td>
                      <td>Bills</td>
                      <td>25/11/2026</td>
                      <td>
                        <div class="d-flex flex-column flex-lg-row gap-1 justify-content-center align-items-center">
                          <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                            data-bs-target="#edit-expinse-modal">Edit</button>
                          <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal"
                            data-bs-target="#delete-expinse-modal">Delete</button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>


    <!--Edit Expense Modal-->
    <div class="modal fade " id="edit-expinse-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form class="" action="">

              <div class="row">
                <div class="mb-3 col-12">
                  <label for="title" class="form-label">Title</label>
                  <input type="text" class="form-control" id="title" name="title" placeholder="Lunch">
                </div>

                <div class="mb-3 col-12">
                  <label for="amount" class="form-label">Amount</label>
                  <input type="number" class="form-control" id="amount" name="amount" placeholder="4.50">
                </div>

                <div class="mb-3 col-12">
                  <label for="category" class="form-label">Category</label>
                  <select class="form-select" name="category" id="category">
                    <option value="none" selected disabled>Choose...</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="mb-3 col-12">
                  <label for="Date" class="form-label">Date</label>
                  <input type="date" class="form-control" id="date" name="date" />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" id="confirm-edit" data-bs-dismiss="modal">Save
              changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Expense Modal -->
    <div class="modal fade" id="delete-expinse-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Delete Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            Are you sure you want to delete this expense?
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="button" class="btn btn-danger" data-bs-dismiss="modal" id="confirm-delete">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
