<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->
  <header>
    <nav class="navbar navbar-expand-sm navbar-light bg-dark text-light">
      <div class="container ">
        <a class="navbar-brand text-light fw-bold fs-4" href="#">Expense Tracker</a>
      </div>
      </div>
    </nav>
  </header>

  <body class="bg-light">
    <div class="container">

      <div class="row justify-content-center align-items-center my-4 g-3">

        <div class="col-md-4">
          <div class="d-flex card justify-content-center align-items-center">
            <div class="card-body">
              <p class="card-text text-center text-muted fw-medium">Total</p>
              <h4 class="card-title text-center">0.0</h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex card justify-content-center align-items-center">
            <div class="card-body">
              <p class="card-text text-center text-muted fw-medium">Number of expenses</p>
              <h4 class="card-title text-center">0</h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex card justify-content-center align-items-center">
            <div class="card-body">
              <p class="card-text text-center text-muted fw-medium">Highest expense</p>
              <h4 class="card-title text-center">0.0</h4>
            </div>
          </div>
        </div>

      </div>

      <div class="row justify-content-center align-items-center my-4 g-3">

        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <p class="card-text fw-bold fs-5 text-muted fw-medium">Add Expense</p>
              <form class="" action="">

                <div class="row">
                  <div class="mb-3 col-md-4">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="Lunch">
                  </div>

                  <div class="mb-3 col-md-2">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" class="form-control" id="amount" name="amount" placeholder="4.50">
                  </div>

                  <div class="mb-3 col-md-3">
                    <label for="category" class="form-label">Category</label>
                    <select class="form-select" name="category" id="category">
                      <option value="none" selected disabled>Choose...</option>
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div class="mb-3 col-md-3">
                    <label for="Date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" />
                  </div>
                </div>
                <button class="btn btn-primary col-12 col-md-auto" type="submit">
                  Add expense
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center align-items-center my-4 g-3">

        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <p class="card-text fw-bold fs-5 text-muted">Expenses</p>
                <form action="">
                  <div class="d-flex align-items-center justify-content-center">
                    <label for="category-filter" class="form-label mx-2">Category:</label>
                    <select class="form-select" name="category-filter" id="category-filter">
                      <option value="All" selected>All</option>
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                </form>
              </div>
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th scope="col" class="col-4">Title</th>
                    <th scope="col" class="col-1">Amount</th>
                    <th scope="col" class="col-2">Category</th>
                    <th scope="col" class="col-3">Date</th>
                    <th scope="col" class="col-2">Action</th>
                  </tr>
                </thead>
                <tbody id="expenses-table-body">
                  <tr>
                    <td>Electricity</td>
                    <td>20</td>
                    <td>Bills</td>
                    <td>25/11/2026</td>
                    <td class="w-auto">
                      <div>
                        <button type="button" class="btn btn-outline-primary">Edit</button>
                        <button type="button" class="btn btn-outline-danger">Delete</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </body>
  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
